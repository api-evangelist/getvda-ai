dry_run_mode:
  supported: true
  status: documented
  mechanism: stateless prepare + free selftest/demo paths
  surfaces:
  - operation: 'POST /api/witness/prepare'
    description: 'Customer-managed custody step 1 — "STATELESS": Witness assembles the shaped record and returns canonicalBytes without writing; nothing is committed until the signed record is submitted.'
  - operation: 'POST /api/witness/verify (public)'
    description: Verify any record or chain without a key or an account.
  - operation: 'C2MD generate_evidence_readiness_report data_mode "demo"'
    description: Synthetic, LLM-free, deterministic, zero external calls; output labelled SAMPLE — DEMO DATA.
  - operation: 'GOSCE selftest (GET /selftest, MCP tool selftest)'
    description: Runs the real capability on canned input for free.
  detail: sandbox/getvda-ai-sandbox.yml
reversibility:
  grade: documented
  docs: https://witness.getvda.ai/llms.txt
  note: >-
    Reversal paths exist for every revocable object — an API key, an admission credential, a HITL baseline, an ACP
    governance version — and each is itself sealed as a new record; but the provider states NO reversal WINDOW for
    any of them, so the grade is documented (0.4), not verified. The core write surface — sealing a record — is
    IRREVERSIBLE BY DESIGN: a sealed record is append-only on a hash chain and "validity is COMPUTED, revocation is
    a new superseding record", so the reversal of a seal is a superseding seal, never a delete. Nothing below asserts
    a window the provider has not written down. Propagation latencies the docs do state ("verify reflects it within
    ~60s") are cache lags, not reversal windows, and are not graded as windows.
  write_surfaces:
  - operation: 'POST /api/witness/seal and the three shaped seals'
    action: Append a signed record to the account's chain
    reversal: none — records are immutable; correct by sealing a superseding record on the same chainKey
    reversal_operation: null
    window: null
    stated_terms: ['"Immutable — validity is COMPUTED, revocation is a new superseding record."']
  - operation: 'POST /api/witness/credentials/issue'
    action: Issue an agent admission credential (a sealed attestation)
    reversal: revoke — terminal
    reversal_operation: 'POST /api/witness/credentials/{credential_id}/revoke (MCP revoke_admission_credential); issuer account only; reason_code policy_violation | superseded | compromised | environment_offboarded | other'
    window: null
    stated_terms: ['"Revoke (needs the ISSUING account''s key — only the issuer may revoke; terminal) ... -> new revocation record; verify reflects it within ~60s."']
  - operation: 'POST /api/witness/test-key / renew (key issuance)'
    action: Mint an account API key
    reversal: revoke — total, sealed as a key_revocation event
    reversal_operation: 'POST /api/witness/keys/revoke (operationId revoke_api_key); reason_code compromised | exposed | rotated | superseded | operator_action | other'
    window: null
    stated_terms: ['"Revocation is TOTAL: a revoked key 401s AND its account''s records become unfetchable with it — no operator backdoor."']
  - operation: 'HITL baseline promotion (via resolve_hitl_item)'
    action: Widen a caller's decision baseline
    reversal: revoke_baseline — never a delete
    reversal_operation: 'POST /v1/tools/revoke_baseline (operationId revoke_baseline)'
    window: null
    stated_terms: ['"Revoke a baseline and seal the revocation. Never a delete — the row and its trail remain"']
  - operation: 'ACP POST /v1/environments/{env}/versions/activate'
    action: Activate a signed governance bundle version
    reversal: rollback = activate the previous version
    reversal_operation: 'POST /v1/environments/{env}/versions/activate with the prior version (documented in @getvda/distribution: "Rollback = activate the previous version")'
    window: null
    stated_terms: ['"Rollback = activate the previous version."']
  - operation: 'HITL resolve_hitl_item / ACP pulls/{num}/decision'
    action: Record a human decision (sealed, merges on approve)
    reversal: none documented
    reversal_operation: null
    window: null
