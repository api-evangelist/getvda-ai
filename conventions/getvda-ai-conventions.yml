media_type: application/json
auth:
  style: >-
    One suite credential — a Witness API key presented as `Authorization: Bearer wtn.<keyId>.<secret>` (Witness
    also accepts an `x-witness-key` header) — validated by every sibling service through Witness GET /whoami
    ("Contract A"). Keys are short-lived and self-minted (POST /api/witness/test-key, no human) and renewed by
    Ed25519 controller-key challenge-response rather than by a standing secret. C2MD additionally accepts Google
    and Microsoft OAuth 2.0 tokens; ACP additionally takes an OIDC approver credential in X-Approver-Credential
    (staged); Onboarding a per-tenant bearer; the GOSCE fleet takes no credential at all and gates execution
    with x402 payment.
  detail: authentication/getvda-ai-authentication.yml
idempotency:
  supported: true
  coverage: partial
  mechanism: request-body key
  header: null
  field: decisionId
  scope:
  - 'POST /api/witness/seal — SealRequest.decisionId, optional, deduped on (account, decisionId)'
  - 'POST /api/witness/seal/attestation — the seal_attestation MCP inputSchema carries decisionId'
  retention: undocumented (a UNIQUE index on (account, decisionId) — no expiry stated)
  description: >-
    Witness documents "Idempotency — send decisionId; dedupe is on (account, decisionId): the same value returns the
    existing record with deduped:true (never cross-tenant)". It is a body field, not an Idempotency-Key header, and
    it exists on the generic seal and the attestation seal only — seal_hitl_decision and seal_agent_action carry no
    decisionId in their schemas, and the credential issue/revoke, key revoke, HITL raise/resolve and ACP
    activate/decision writes have no replay key at all. The docs also warn that decisionId is NOT namespaced by
    chainKey, so the same id on a different chain collides and returns the first record. Customer-managed custody
    has a different safety property: prepare is stateless and submit fails with 409 if the chain advanced, so a
    stale retry cannot double-write — but a successful submit retried is a second record.
  gaps:
  - No idempotency key on seal_hitl_decision, seal_agent_action, credentials/issue, credentials/{id}/revoke, keys/revoke.
  - No idempotency key on any HITL write (raise_hitl_item, resolve_hitl_item, register_authority_config) or ACP write (decision, activate).
  - No documented safe-retry guidance for an ambiguous outcome (timeout after a successful seal).
pagination:
  style: cursor
  params: [limit (1-500), cursor, chainKey, since, until]
  response_fields: [records, nextCursor, chainKeys]
  evidence: 'GET /api/witness/records — filters chainKey, since/until (ISO-8601), limit (1-500), cursor; HITL list_hitl_items returns summaries only (no evidence, statement or domain_ref).'
grouping:
  primitive: chainKey
  description: 'chainKey is the ordering namespace AND the grouping primitive — "Witness has NO bundle_id / group_id / parent_id field". Max 128 chars [A-Za-z0-9._:-]; omitted => "default"; account-scoped (a foreign chainKey is 404).'
