                    type: string
        '401':
          description: Missing/invalid key
      tags:
      - Witness
      operationId: getApiWitnessUsage
      x-operation-id-source: derived
  /api/witness/whoami:
    get:
      summary: Resolve the presented API key to its account + tier (suite-service credential…
      description: 'For sibling getvda.ai services (e.g. C2MD) that accept `Authorization: Bearer wtn..` from their own callers and need to validate it: Witness is the source of truth for its own keys, so the sibling calls whoami instead of replicating the key store. Any valid Witness key may call whoami about ITSELF (no elevated scope) — a key can only ever ask about the key it presents, so no other account is enumerable. `tier` is resolved from ACCOUNT state (ANCHORED when the account is on the anchored/compliance tier, else SEALED), not from the key. On success: `Cache-Control: private, max-age=60` (stable enough to cache ~1 min; revocations may lag by that). 401s are `no-store` and carry a generic message (no keyId-exists vs wrong-secret leak). Permissively rate-limited per calling IP AND per account.'
      security:
      - witnessApiKey: []
      responses:
        '200':
          description: 'Resolved identity (Cache-Control: private, max-age=60)'
          content:
            application/json:
              schema:
                type: object
                required:
                - account_id
                - tier
                - scopes
                - compliance
                - key_id
                - revoked
                properties:
                  account_id:
                    type: string
                    description: acct_<ULID>
                  tier:
                    type: string
                    enum:
                    - SEALED
                    - ANCHORED
                    description: From account state, not the key
                  scopes:
                    type: array
                    items:
                      type: string
                    description: e.g. ["seal","read"]
                  compliance:
                    type: boolean
                    description: true iff ANCHORED tier
                  key_id:
                    type: string
                    description: The presented key's id (for caller-side logging/debug)
                  revoked:
                    type: boolean
                    const: false
                    description: Always false on a 200 — a revoked key 401s
                  expires_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: Key validity window (ISO-8601), or null if non-expiring — a sibling authorizing on this response should treat a past value as invalid
        '401':
          description: Missing / malformed / unknown / wrong-secret / revoked key — one generic message, no-store (no existence leak)
        '429':
          description: whoami rate limit exceeded (per IP and per account)
      tags:
      - Witness
      operationId: getApiWitnessWhoami
      x-operation-id-source: derived
  /api/witness/anchor-status:
    get:
      summary: Anchor coverage for your account/chain
      security:
      - witnessApiKey: []
      parameters:
      - name: chainKey
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  headAnchored:
                    type: boolean
                  externalValid:
                    type: boolean
                  pendingRecords:
                    type: integer
      tags:
      - Witness
      operationId: getApiWitnessAnchorStatus
      x-operation-id-source: derived
  /api/witness/mcp:
    post:
      summary: Model Context Protocol endpoint (initialize / tools/list / tools/call…
      responses:
        '200':
          description: JSON-RPC 2.0 response
      tags:
      - Witness
      operationId: postApiWitnessMcp
      x-operation-id-source: derived
components:
  schemas:
    EvidenceItem:
      type: object
      required:
      - ref
      - hash
      description: A content-addressed reference to EXTERNAL system-of-record material. The hash makes it tamper-evident even if `ref` rots or is swapped.
      properties:
        ref:
          type: string
          description: URI / id / a Witness recordId
        hash:
          type: string
          description: sha256:<hex> of the artifact
        media_type:
          type: string
        description:
          type: string
        captured_at:
          type: string
          format: date-time
        inline:
          type: object
          required:
          - encoding
          - bytes
          properties:
            encoding:
              type: string
              enum:
              - base64
              - utf8
            bytes:
              type: string
          description: Embed the artifact (≤100KB decoded); Witness verifies bytes against `hash` at seal time.
    Clause:
      type: object
      required:
      - ref
      description: A cited policy/rule. Capture `text`/`hash` where possible — policies drift, and an auditor needs the version in force.
      properties:
        ref:
          type: string
        text:
          type: string
        hash:
          type: string
          description: sha256:<hex> of the policy source version
    WitnessRecord:
      type: object
      description: The signed body + proof. Everything except `proof` is covered by the Ed25519 signature.
      properties:
        schema:
          type: string
          const: vda.witness.record/1
        recordId:
          type: string
        account:
          type: string
          description: Server-minted opaque account ULID, bound to your credential, signed.
        seq:
          type: integer
        issuedAt:
          type: string
          format: date-time
        signer:
          type: object
        decision:
          $ref: '#/components/schemas/Decision'
        governingRule:
          $ref: '#/components/schemas/GoverningRule'
        prevHash:
          type:
          - string
          - 'null'
        proof:
          type: object
          properties:
            algorithm:
              const: Ed25519
            signature:
              type: string
            created:
              type: string
    Decision:
      type: object
      required:
      - agent
      - verdict
      - reasoning
      properties:
        agent:
          type: string
          description: Which agent made the decision
          maxLength: 65536
        inputs:
          description: The decision inputs (any JSON; size-capped ~256KB canonical)
        verdict:
          type: string
          description: The verdict/decision reached
          maxLength: 65536
        reasoning:
          type: string
          description: Why
          maxLength: 65536
        actionProposed:
          type: string
          description: 'Optional: what was/should be done'
    GoverningRule:
      type: object
      required:
      - ruleId
      - ruleText
      properties:
        ruleId:
          type: string
        ruleText:
          type: string
          description: The governing rule verbatim (or a stable reference)
        governanceRef:
          type: string
          description: 'Optional: e.g. AGENTS.md#refunds'
        governanceHash:
          type: string
          description: 'Optional: sha256:… of the governance source'
    SealRequest:
      type: object
      required:
      - decision
      - governingRule
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        governingRule:
          $ref: '#/components/schemas/GoverningRule'
        chainKey:
          type: string
          description: Per-(account,chain) ordering namespace; default 'default'. Max 128 chars [A-Za-z0-9._:-]. This is ALSO the grouping primitive — records sharing a chainKey are hash-linked into one set that is retrievable and provable as a set (GET /api/witness/chains/{chainKey}/proof, GET /api/witness/records?chainKey=, POST /api/witness/report {chainKey}). Give the seals of one workflow/bundle/case a stable shared key (e.g. 'c2md:bundle:<id>') rather than grouping by convention inside your own payloads. There is no separate bundle_id/group_id field.
          default: default
        decisionId:
          type: string
          description: 'Idempotency key. Dedupe is on (account_id, decisionId): the same value returns the existing record with `deduped: true`.'
    Actor:
      type: object
      required:
      - id
      - type
      properties:
        id:
          type: string
          description: Actor identity — ASSERTED by your credential; Witness seals the claim, it does not authenticate the actor.
        type:
          type: string
          enum:
          - human
          - agent
          - system
        role:
          type: string
          description: Optional — the authority under which they acted
  securitySchemes:
    witnessApiKey:
      type: http
      scheme: bearer
      description: 'API key as a Bearer token. The `x-witness-key: <key>` header also works.'
