  /api/witness/usage:
    get:
      summary: This account's seal usage + monthly headroom (Sealed tier includes 5,000…
      description: 'Soft/observable: measured, NEVER enforced — over the allowance sealing continues (billing is not yet live). The same block rides on every seal response.'
      security:
      - witnessApiKey: []
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
