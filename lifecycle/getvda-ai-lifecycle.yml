versioning:
  scheme: 'path-versioned on HITL and ACP (/v1/...); unversioned paths on Witness (/api/witness/...); version carried in each OpenAPI info.version and each agent card'
  current_version: 'Witness 1.0.0 (OpenAPI, card, MCP serverInfo agree); HITL 0.1.0; ACP 0.1.0; C2MD 1.0.0 (card + MCP); Onboarding 0.1.0-skeleton; GOSCE router 0.1.0; fleet agents 0.1.1'
  spec_url: https://witness.getvda.ai/openapi.json
  base_url: https://witness.getvda.ai
  policy_published: false
  note: >-
    No versioning policy page exists on any host (/changelog, /status, /blog on getvda.ai and witness.getvda.ai all
    return the SPA shell, not a page). What the provider does publish is unusually explicit HONEST-STATUS labelling
    at the field level: the apex llms.txt ("honest status as of 2026-08") marks each block live / staged / planned,
    the Witness test-key response labels `tier` and `compliance` as "DEPRECATED aliases — read sealedState", the
    docs call POST /api/witness/test-key a "stable endpoint name", the C2MD card marks generate_journey_baseline
    "PLANNED — NOT YET AVAILABLE" (returns -32601), the ACP card marks its MCP surface planned and federated
    identity staged, and the Onboarding card enumerates live vs staged phases. Both HITL and ACP serve a live
    /readyz whose body reports per-capability status with probe timestamps.
