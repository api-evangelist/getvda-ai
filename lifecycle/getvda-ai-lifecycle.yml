status_page:
  url: null
  note: >-
    status.getvda.ai does not resolve and /status on the apex and Witness hosts is the SPA shell. HITL and ACP
    publish machine-readable readiness at GET /readyz (live probes of witness/store/genesis/issuer identity, with
    checkedAt timestamps) and Witness's card carries a `status`-free `boundaries` block; the HITL card embeds a
    live `status` object (ready, witness, store, genesis, issuer_identity). That is an operational health surface,
    not a status page, so no StatusPage pointer is emitted.
sla:
  published: false
  note: The Witness terms block offers "Volume, SLA, higher-assurance tier" only under Enterprise ("talk to us"); no SLA figures are published.
key_lifecycle:
  note: >-
    Witness API keys are short-lived by design (self-serve Sealed keys expire in 7 days: expiresInDays 7) and are
    renewed unattended by controller-key challenge-response; prior keys stay valid until they expire (overlap). A
    non-expiring key is described as "an explicit, audited EXCEPTION". Revocation is total and itself sealed as a
    key_revocation event; whoami reflects it within a ~60s cache window.
