  - name: get_hitl_item
    rest: get_hitl_item
    description: Get one decision item
  - name: resolve_hitl_item
    rest: resolve_hitl_item
    description: Record a human decision (sealed customer-managed to Witness)
  - name: list_baselines
    rest: list_baselines
    description: List active baselines for a caller
  - name: revoke_baseline
    rest: revoke_baseline
    description: Revoke a baseline (never a delete; sealed)
  - name: match_baseline
    rest: match_baseline
    description: Parity check for baseline containment
  - name: register_authority_config
    rest: register_authority_config
    description: Register an activated authority config
  - name: get_raise_quota
    rest: get_raise_quota
