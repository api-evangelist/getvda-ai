summary: >-
  Three MCP surfaces are bound to three REST contracts. Witness: 16 live tools map onto 23 REST operations — every
  tool has a backing route (the OpenAPI's own /api/witness/mcp description lists the tool names), and the tool
  inherits that route's request body as its real inputSchema; 7 REST operations (renewal/controller plumbing,
  usage, anchor-status, the chain proof and the MCP route itself) have no tool. The provider declares operationIds
  on only two Witness routes, so bindings are by method + path. HITL: 9 tools map 1:1 onto 9 POST /v1/tools/<name>
  operations with identical operationIds — the cleanest crosswalk in the catalog — with genesis, discovery and
  health REST-only. C2MD: 11 live tools, ZERO backing REST operations — the C2MD OpenAPI is a FastAPI edge-proxy
  shell (healthz, card, key PEM, robots and a catch-all {full_path} proxy), so every C2MD tool is mcp_only and its
  real contract is the A2A card's skills[].inputSchema (8 skills) plus three MCP-only helpers. Confidence is high
  where a live inputSchema and a spec request body were both read, medium where the tool is documented only in the
  card.
