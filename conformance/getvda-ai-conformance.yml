summary: >-
  VDA's conformance profile is the agent-identity and agent-commerce protocol stack, not an enterprise sector
  standard: eight A2A agent cards (five at 0.3.0 shape, graded in a2a/), four live MCP servers (protocol 2024-11-05
  on Witness and C2MD, 2026-07-28 on the GOSCE router), JSON-RPC 2.0 on every one of them, W3C did:web DID
  documents on five hosts with Ed25519 JsonWebKey2020 verification methods, detached EdDSA JWS (RFC 7515) card
  signatures verifiable against an RFC 7517 JWKS, Ed25519 (RFC 8032) hash-chained records, and — on the paid
  Anchored tier only — external anchoring to Sigstore Rekor and RFC 3161 timestamp authorities. The GOSCE fleet
  meters execution with x402 v2 (HTTP 402 + PAYMENT-REQUIRED header, EIP-3009 transferWithAuthorization in USDC on
  Base, CAIP-2 eip155:8453). C2MD declares OAuth 2.0 authorization-code and client-credentials flows against Google
  and Microsoft Entra as identity providers; ACP declares an OIDC approver credential but reports identity
  "DISABLED" on its live readyz. Nothing here is RFC 9457, no host serves RFC 9116 security.txt or RFC 9727
  api-catalog, and no RFC 8594 Sunset/Deprecation signalling exists. The domain-standard signature for this
  market (AI-agent governance / verifiable agent identity) is the did:web + W3C-VC-shaped admission credential
  surface, declared in the contracts themselves.
standards:
- id: a2a
  name: Agent2Agent protocol
  version: '0.3.0'
  conforms: true
  evidence: >-
    a2a/getvda-ai-a2a.yml — eight served cards; five graded conformant (Witness protocolVersion 0.2.5 with
    preferredTransport HTTP+JSON; HITL, C2MD, router and fleet at 0.3.0 with JSONRPC and A2A urls at /a2a). C2MD's
    llms.txt documents `skills/<name>` JSON-RPC methods and get_task polling for long-running skills.
- id: mcp
  name: Model Context Protocol
  version: '2024-11-05 (Witness, C2MD); 2026-07-28 (GOSCE router and fleet)'
  conforms: true
  evidence: >-
    POST https://witness.getvda.ai/api/witness/mcp initialize -> protocolVersion "2024-11-05", serverInfo
    {vda-witness 1.0.0}; tools/list -> 16 tools with inputSchema. POST https://c2md.getvda.ai/mcp -> "2024-11-05",
    11 tools. POST https://router.getvda.ai/mcp -> "2026-07-28", 2 tools. See mcp/getvda-ai-mcp.yml.
- id: json-rpc-2.0
  conforms: true
  evidence: Every MCP and A2A endpoint answers {"jsonrpc":"2.0",...}; C2MD documents -32601 for the planned generate_journey_baseline skill.
- id: did-web
  name: W3C Decentralized Identifiers (did:web method)
  conforms: true
  domain_standard_signature: true
  evidence: >-
    /.well-known/did.json served on witness, acp, onboard, hitl and agents.getvda.ai — @context https://www.w3.org/ns/did/v1
    + https://w3id.org/security/suites/jws-2020/v1, JsonWebKey2020 Ed25519 verificationMethod[], assertionMethod[],
    and a rotationLog (saved verbatim in well-known/). The Witness OpenAPI's check_valid response defines
    issuer_verification states (verified / key_not_in_did_doc / custodial / did_unresolvable) resolved against the
    issuer's did:web document, and the ACP BundleManifest schema carries `did` and `keyId` (did:web:acp.getvda.ai#key-3).
  note: >-
    The contract-level signature for this market: agent identity, admission credentials and card signatures all
    resolve through did:web documents the provider serves. Admission credentials are "W3C VC"-shaped per the VDA-MD
    whitepaper but the served credential schema was not fetched (issue needs a key), so VC conformance is not asserted.
- id: jws-rfc7515
  name: JSON Web Signature (detached EdDSA JWS) + JWKS (RFC 7517)
  conforms: true
  evidence: >-
    GOSCE router and fleet cards carry `proof.jws` with canonicalisation rules and `proof.jwks`
    https://agents.getvda.ai/.well-known/jwks.json (application/jwk-set+json, one EdDSA/Ed25519 key, kid
