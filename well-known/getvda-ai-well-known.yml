note: 'Ten hosts probed: the apex getvda.ai (and www, which does not resolve), the five governance-block hosts named
  in the apex card''s relatedServices (witness, c2md, acp, onboard, hitl), the GOSCE fleet''s index host agents.getvda.ai
  and router.getvda.ai, and one representative fleet agent host. NONE of the rating''s scored discovery documents
  is served anywhere: no security.txt (RFC 9116), no api-catalog (RFC 9727), no openid-configuration, no oauth-authorization-server
  / oauth-protected-resource (RFC 8414 / RFC 9728 — the MCP servers on witness, c2md and router authenticate with
  a Witness bearer key or x402 payment rather than OAuth, so there is no auth-server to describe), no ai-plugin.json,
  no ucp/acp/aauth documents and no apis.json. Accordingly NO WellKnown and NO SecurityTxt pointer is emitted. What
  the provider DOES publish at RFC 8615 paths is an agent-identity surface the rubric does not yet score: W3C did:web
  DID documents on five hosts (witness, acp, onboard, hitl, agents — Ed25519 JsonWebKey2020 verification methods
  with a rotationLog), an RFC 7517 JWKS on agents.getvda.ai that signs every fleet agent card, and a 99-entry ''AgenticResourceCatalog''
  at agents.getvda.ai/.well-known/ai-catalog.json (specVersion 1.0, one entry per metered MCP server with x402 payment
  terms) that the agents DID document names as its catalog service. Those are saved verbatim and indexed here with
  document: true. The apex getvda.ai is a Google-Frontend SPA that answers 200 text/html (the 17,108-byte index
  shell) for every EXTENSION-LESS unknown path while a path carrying a file extension 404s (the .json negative control
  returned 404; /.well-known/getvda-ai-negative-control-9c1e4d7a without an extension returned the shell) — so its
  openid-configuration / oauth-authorization-server / oauth-protected-resource / api-catalog 200s are the SPA shell
  and are marked document: false; the legacy /.well-known/agent.json on that host is a real but older JSON document,
  distinct from its agent-card.json. hitl.getvda.ai answers 401 for every path but its card, DID document, openapi.json
  and health probes. Agent cards are indexed here for completeness and graded in a2a/getvda-ai-a2a.yml.'
