    Admission authority for the suite — an A2A agent (6 skills) that runs holder-binding (DID-auth), intake
    and gap analysis for a candidate agent and issues a Witness-sealed admission credential against did:web:onboard.getvda.ai.
    Card version 0.1.0-skeleton; phases 4-6 staged. No OpenAPI or MCP of its own (admission tools are
    exposed over the Witness MCP).
