- name: VDA Witness API
  description: >-
    Seal governed AI-agent decisions into tamper-evident, Ed25519-signed, independently-verifiable records and verify
    them offline; issue, check and revoke agent admission credentials; self-serve key minting and agent-provable
    renewal; EU AI Act Article 12 evidence reports. 23 operations; verify and check_valid are public, sealing needs a
    key the API mints in-band. Also exposed as a 16-tool remote MCP server.
