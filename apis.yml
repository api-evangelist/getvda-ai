- name: VDA HITL API
  description: >-
    Human decisions on agent actions: register an authority config, raise an escalated decision, read it, record the
    human resolution (sealed to Witness under customer-managed custody), manage baselines and read quota. 17
    operations; discovery public, every tool call requires a Witness bearer (Contract A). The 9 tools are mirrored on
    an auth-gated remote MCP endpoint.
