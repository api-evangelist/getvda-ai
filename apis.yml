- name: GOSCE Agent Portfolio and Router
  description: >-
    The GOSCE (GitHub Open-Source Combination Engine) fleet: 98 templated remote MCP + A2A agents at
    <agent>.getvda.ai, each with two tools (invoke, selftest), an Ed25519-signed agent card verifiable against the
    agents.getvda.ai JWKS, and x402 v2 pay-per-call metering ($0.025 USDC on Base or Stripe card; discovery and
    selftest free). Indexed at agents.getvda.ai (portfolio API, did.json, jwks.json, a 99-entry ai-catalog.json) and
    fronted by router.getvda.ai, the single entry point that routes by capability.
