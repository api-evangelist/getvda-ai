aid: getvda-ai
name: Verified Digital Agents (VDA)
description: >-
  Verified Digital Agents (VDA, getvda.ai) sells governance for AI agents that can be proved after the fact:
  Witness seals every governed decision into an Ed25519-signed, hash-chained record (anchored to Sigstore
  Rekor and RFC 3161 TSAs on the paid tier) and produces EU AI Act Article 12 evidence; C2MD turns EU AI Act,
  GDPR, NIST SP 800-53 and ISO 42001 controls into governance Markdown agents can follow; ACP versions, tests,
  approves and signs that governance in git and serves it as signed bundles; Onboarding admits agents and
  issues Witness-sealed admission credentials against did:web identities; HITL routes what exceeds an agent's
  authority to a human and seals the decision. Every block publishes a signed A2A agent card,
  Witness/C2MD/HITL run remote MCP servers, and Witness/HITL/ACP publish OpenAPI 3.1. The same operator runs
  GOSCE, a 98-server fleet of templated, x402-metered MCP/A2A agents under *.getvda.ai — the "VDA / GOSCE"
  author that a2aregistry.org counted as 98 agents.
