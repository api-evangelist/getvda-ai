- name: VDA ACP API
  description: >-
    Agent Control Plane — the governance-aware wrapper on git: load a governance set at a ref, prepare and
    Compliance-Guard a change, run the governance CI suite, surface it for a non-engineer approver, record the
    decision (sealed hitl_decision, merges on approve), build/sign/activate a governance bundle sealed to Witness, and
    serve signed bundles publicly. 12 operations; MCP surface declared planned.
  image: https://getvda.ai/favicon.svg
  humanURL: https://getvda.ai/blocks/acp.html
  baseURL: https://acp.getvda.ai
