source: >-
  The clientLibraries block of https://getvda.ai/.well-known/agent-card.json and the Integrations section of
  https://getvda.ai/llms.txt (which name getvda-evaluator and the seven @getvda/* npm packages), plus the
  "Verify a record" section of https://witness.getvda.ai/llms.txt (which names `npm i vda-witness` and
  `pip install "vda-witness[verify]"`). Every version and publish date was read live from
  registry.npmjs.org/<pkg> and pypi.org/pypi/<pkg>/json on 2026-09-19.
note: >-
  Ten first-party packages across npm and PyPI, all pointing at getvda.ai as homepage and all Apache-2.0
  (PyPI classifiers name "Verified Digital Agents <hello@getvda.ai>" as author; the npm packages are
  maintained by mikerawsonnz, the VDA-MD framework's author). Two release trains are visible: the vda-witness
  SDK pair shipped 1.0.0 on 2026-07-03 within nine seconds of each other on both registries and has not
  moved since; the seven @getvda/* ACP packages all landed as 0.1.0/0.2.0 on 2026-07-21 within two minutes of
  each other (a single monorepo release), and getvda-evaluator — the Python evaluator with the LangChain
  DeepAgents middleware — followed on 2026-08-24. Every package names github.com/getvda-ai/acp-agent as its
  repository, but that repository returns 404 (private or not yet public), so the SDK source is not
  inspectable; only vda-md-framework (CC-BY-4.0 whitepaper) and vda-os are public under the getvda-ai org.
  The Witness API these wrap is at info.version 1.0.0 and its card was re-signed 2026-09-17, so the SDKs are
  two and a half months behind the surface they wrap — a currency gap, not yet an abandonment signal.
