note: >-
  The OAuth scopes live in the served C2MD agent card's securitySchemes, not in any OpenAPI (the C2MD OpenAPI is
  an edge-proxy shell with no securitySchemes, so derive-oauth-scopes.py has nothing to read). The same five
  c2md:* scopes are declared identically under google_oauth2 and microsoft_oauth2 authorizationCode flows, plus
  one Microsoft clientCredentials scope for pre-registered service principals. The witness_bearer scheme maps a
  Witness ACCOUNT tier to the same access ladder without OAuth: SEALED -> assess-tier skills, ANCHORED ->
  generate_starter and above. Witness's own whoami returns scopes ["seal","read"] for a key; those are
  account-level grants, not OAuth scopes, and are listed under witness_account_scopes.
authorization_servers:
- name: Google
  authorization_url: https://accounts.google.com/o/oauth2/v2/auth
  token_url: https://oauth2.googleapis.com/token
  flows: [authorizationCode]
  audience: Workspace and personal Google accounts; token validated via Google's JWKS
- name: Microsoft Entra ID (organizations)
  authorization_url: https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize
  token_url: https://login.microsoftonline.com/organizations/oauth2/v2.0/token
  flows: [authorizationCode, clientCredentials]
  audience: work and school accounts only; personal Microsoft accounts not supported
